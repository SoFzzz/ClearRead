# Render Blueprint for the ClearRead backend (§6.6).
# Fields checked against https://render.com/docs/blueprint-spec on 2026-10-07.
# Secrets use "sync: false": Render asks for the value in the dashboard, so none is stored here.
services:
  - type: web
    name: clearread-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn clearread_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # With this variable Render requires a fully qualified version.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CLIENT_TOKEN
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      - key: DAILY_CALL_LIMIT
        sync: false
      # Firebase Authentication key: a public web API key, still kept out of the file.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: USER_DAILY_CALL_LIMIT
        sync: false
      # Google sign-in through the backend (v1.7.0). PUBLIC_BASE_URL falls back to
      # RENDER_EXTERNAL_URL, which Render sets by itself.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
